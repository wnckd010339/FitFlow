<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>운동 기록 저장 | FitFlow</title></head><body><header class="portal-header"><a class="brand" href="/trainer/home"><span>F</span>FitFlow</a><nav><a href="/trainer/members">담당 회원</a><a href="/trainer/routines">운동 루틴</a><a class="active" href="/trainer/workouts">운동 기록</a></nav></header><main class="portal-main"><a class="back-link" href="/trainer/workouts">← 운동 기록</a><section class="card form-card"><div class="page-heading"><div><p class="eyebrow">WORKOUT LOG</p><h1 th:text="${sessionId == null ? '운동 기록 작성' : '운동 기록 수정'}"></h1></div></div><form th:action="${sessionId == null ? '/trainer/workouts' : '/trainer/workouts/' + sessionId}" method="post" th:object="${workoutForm}"><div class="form-grid"><div class="field"><label>회원</label><select th:field="*{memberId}"><option value="">회원 선택</option><option th:each="m:${members}" th:value="${m.memberId}" th:text="${m.name}"></option></select></div><div class="field"><label>루틴 ID (선택)</label><input th:field="*{routineId}"></div><div class="field"><label>운동 종목</label><input th:field="*{exerciseName}"></div><div class="field"><label>세트 수</label><input type="number" th:field="*{sets}"></div><div class="field"><label>중량(kg)</label><input type="number" step="0.5" th:field="*{weight}"></div><div class="field"><label>반복 횟수</label><input type="number" th:field="*{reps}"></div><div class="field"><label>운동 시간(분)</label><input type="number" th:field="*{durationMinutes}"></div><div class="field wide"><label>메모</label><textarea th:field="*{memo}"></textarea></div></div><div class="form-actions"><a class="button secondary" href="/trainer/workouts">취소</a><button>저장</button></div></form></section></main></body></html>
