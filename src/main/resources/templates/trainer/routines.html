<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>운동 루틴 | FitFlow</title></head><body><header class="portal-header"><a class="brand" href="/trainer/home"><span>F</span>FitFlow</a><nav><a href="/trainer/home">홈</a><a href="/trainer/members">담당 회원</a><a class="active" href="/trainer/routines">운동 루틴</a><a href="/trainer/workouts">운동 기록</a><a href="/trainer/profile">내 프로필</a></nav><div class="portal-profile"><span class="avatar" th:text="${#strings.substring(headerProfile.name,0,1)}">김</span><div><strong th:text="${headerProfile.name + ' 트레이너'}"></strong><small th:text="${headerProfile.specialty}"></small></div><form th:action="@{/logout}" method="post"><button>로그아웃</button></form></div></header><main class="portal-main"><div class="page-heading"><div><p class="eyebrow">WORKOUT ROUTINES</p><h1>운동 루틴</h1><p>담당 회원에게 맞춤 루틴을 등록하고 관리합니다.</p></div><a class="button" href="/trainer/routines/new">새 루틴 만들기</a></div><section class="card"><div class="toolbar"><form method="get"><select name="memberId"><option value="">전체 회원</option><option th:each="m:${members}" th:value="${m.memberId}" th:selected="${m.memberId == selectedMemberId}" th:text="${m.name}"></option></select><button>조회</button></form></div><table class="data-table"><thead><tr><th>회원</th><th>루틴</th><th>운동</th><th>시작일</th><th></th></tr></thead><tbody><tr th:each="r:${routines}"><td th:text="${r.memberName}"></td><td th:text="${r.title}"></td><td th:text="${r.exerciseName}"></td><td th:text="${r.startDate}"></td><td><a class="link" th:href="@{/trainer/routines/{id}/edit(id=${r.routineId})}">수정</a></td></tr></tbody></table></section></main></body></html>
