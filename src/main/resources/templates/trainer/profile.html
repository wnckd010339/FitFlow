<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>내 프로필 | FitFlow</title></head><body><header th:replace="~{trainer/fragments :: sidebar('profile', ${headerProfile})}"></header><main class="portal-main"><section class="card form-card"><div class="page-heading"><div><p class="eyebrow">MY PROFILE</p><h1>내 프로필</h1><p>회원에게 표시되는 기본 정보를 관리합니다.</p></div></div><p class="notice" th:if="${message}" th:text="${message}"></p><form method="post" th:object="${profileForm}"><div class="form-grid"><div class="field"><label>이름</label><input th:field="*{name}"><p class="field-error" th:errors="*{name}"></p></div><div class="field"><label>연락처</label><input th:field="*{phone}"><p class="field-error" th:errors="*{phone}"></p></div><div class="field wide"><label>전문 분야</label><textarea th:field="*{specialty}" placeholder="예: 근력 향상, 체형 교정"></textarea></div></div><div class="form-actions"><button>저장</button></div></form></section></main></body></html>
