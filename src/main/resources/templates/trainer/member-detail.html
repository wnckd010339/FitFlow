<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>회원 상세 | FitFlow</title></head><body><header class="portal-header"><a class="brand" href="/trainer/home"><span>F</span>FitFlow</a><nav><a class="active" href="/trainer/members">담당 회원</a><a href="/trainer/routines">운동 루틴</a><a href="/trainer/workouts">운동 기록</a></nav></header><main class="portal-main"><a class="back-link" href="/trainer/members">← 담당 회원</a><div class="page-heading"><div><p class="eyebrow">MEMBER DETAIL</p><h1 th:text="${member.name}">회원</h1><p>회원권·출석·운동 현황입니다.</p></div></div><section class="card"><div class="detail-grid"><div><span>연락처</span><strong th:text="${member.phone}"></strong></div><div><span>이메일</span><strong th:text="${member.email}"></strong></div><div><span>활성 회원권</span><strong th:text="${member.activeMembership}"></strong></div><div><span>PT 잔여 횟수</span><strong th:text="${member.remainingPtSessions + '회'}"></strong></div></div><h2 class="section-title">최근 출석</h2><ul class="activity-list"><li th:each="a:${attendances}" th:text="${#temporals.format(a.checkedInAt,'yyyy.MM.dd HH:mm') + ' 체크인'}"></li><li th:if="${#lists.isEmpty(attendances)}">출석 기록이 없습니다.</li></ul><h2 class="section-title">최근 운동</h2><ul class="activity-list"><li th:each="w:${workouts}" th:text="${#temporals.format(w.startedAt,'yyyy.MM.dd') + ' · ' + w.exerciseName + ' ' + w.sets + '세트'}"></li><li th:if="${#lists.isEmpty(workouts)}">운동 기록이 없습니다.</li></ul></section></main></body></html>
