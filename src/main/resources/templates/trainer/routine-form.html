<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>루틴 저장 | FitFlow</title></head><body><header class="portal-header"><a class="brand" href="/trainer/home"><span>F</span>FitFlow</a><nav><a href="/trainer/members">담당 회원</a><a class="active" href="/trainer/routines">운동 루틴</a><a href="/trainer/workouts">운동 기록</a></nav></header><main class="portal-main"><a class="back-link" href="/trainer/routines">← 운동 루틴</a><section class="card form-card"><div class="page-heading"><div><p class="eyebrow">ROUTINE</p><h1 th:text="${routineId == null ? '새 루틴 만들기' : '루틴 수정'}"></h1></div></div><form th:action="${routineId == null ? '/trainer/routines' : '/trainer/routines/' + routineId}" method="post" th:object="${routineForm}"><div class="form-grid"><div class="field"><label>회원</label><select th:field="*{memberId}"><option value="">회원 선택</option><option th:each="m:${members}" th:value="${m.memberId}" th:text="${m.name}"></option></select></div><div class="field"><label>루틴 제목</label><input th:field="*{title}" placeholder="예: 하체 근력 루틴"></div><div class="field wide"><label>설명</label><textarea th:field="*{description}" placeholder="운동 목표 및 유의사항"></textarea></div><div class="field"><label>시작일</label><input type="date" th:field="*{startDate}"></div><div class="field"><label>종료일</label><input type="date" th:field="*{endDate}"></div><div class="field"><label>운동 종목</label><input th:field="*{exerciseName}" placeholder="예: 스쿼트"></div><div class="field"><label>목표 세트</label><input type="number" th:field="*{targetSets}"></div><div class="field"><label>반복 횟수</label><input type="number" th:field="*{targetRepsMin}" placeholder="최소 반복"></div><div class="field"><label>반복 횟수</label><input type="number" th:field="*{targetRepsMax}" placeholder="최대 반복"></div><div class="field"><label>목표 중량(kg)</label><input type="number" step="0.5" th:field="*{targetWeight}"></div><div class="field"><label>휴식 시간(초)</label><input type="number" th:field="*{restSeconds}"></div><div class="field"><label>요일(1~7)</label><input type="number" th:field="*{dayOfWeek}"></div></div><div class="form-actions"><a class="button secondary" href="/trainer/routines">취소</a><button>저장</button></div></form></section></main></body></html>
