<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/screens/trainer-portal.css}"><title>담당 회원 | FitFlow</title></head><body><header class="portal-header"><a class="brand" href="/trainer/home"><span>F</span>FitFlow</a><nav><a href="/trainer/home">홈</a><a class="active" href="/trainer/members">담당 회원</a><a href="/trainer/routines">운동 루틴</a><a href="/trainer/workouts">운동 기록</a><a href="/trainer/profile">내 프로필</a></nav><div class="portal-profile"><span class="avatar" th:text="${#strings.substring(headerProfile.name,0,1)}">김</span><div><strong th:text="${headerProfile.name + ' 트레이너'}"></strong><small th:text="${headerProfile.specialty}"></small></div><form th:action="@{/logout}" method="post"><button>로그아웃</button></form></div></header><main class="portal-main"><div class="page-heading"><div><p class="eyebrow">MY MEMBERS</p><h1>담당 회원</h1><p>배정된 회원의 이용 및 운동 현황을 관리합니다.</p></div></div><section class="card"><div class="toolbar"><form method="get"><input name="keyword" th:value="${keyword}" placeholder="이름 또는 연락처 검색"><button>검색</button></form></div><table class="data-table"><thead><tr><th>회원</th><th>연락처</th><th>활성 회원권</th><th>최근 출석</th><th>최근 운동</th></tr></thead><tbody><tr th:each="member:${members}"><td><a class="link" th:href="@{/trainer/members/{id}(id=${member.memberId})}" th:text="${member.name}"></a></td><td th:text="${member.phone}"></td><td th:text="${member.activeMembership}"></td><td th:text="${member.lastAttendanceAt == null ? '-' : #temporals.format(member.lastAttendanceAt,'yyyy.MM.dd')}"></td><td th:text="${member.lastWorkoutAt == null ? '-' : #temporals.format(member.lastWorkoutAt,'yyyy.MM.dd')}"></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="5" class="empty">담당 회원이 없습니다.</td></tr></tbody></table></section></main></body></html>
