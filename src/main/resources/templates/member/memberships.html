<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 회원권 | FitFlow</title><link rel="stylesheet" th:href="@{/css/screens/member-portal.css}"></head>
<body><header th:replace="~{member/portal-fragments :: header('memberships')}"></header><main class="portal-main"><p class="eyebrow">MEMBERSHIP</p><h1>내 회원권</h1><p class="subtitle">현재 이용권과 이전 이용 이력을 확인하세요.</p><section class="card-grid"><article class="portal-card membership" th:each="membership : ${memberships}"><div class="card-top"><span th:text="${membership.productType}">GYM</span><b th:text="${membership.status}">ACTIVE</b></div><h2 th:text="${membership.productName}">3개월 자유 이용권</h2><p th:text="|${#temporals.format(membership.startDate, 'yyyy.MM.dd')} ~ ${#temporals.format(membership.endDate, 'yyyy.MM.dd')}|">기간</p><strong th:if="${membership.remainingDays != null}" th:text="|D-${membership.remainingDays}|">D-12</strong><small th:if="${membership.remainingPtSessions > 0}" th:text="|잔여 PT ${membership.remainingPtSessions}회|">잔여 PT</small></article><p class="empty" th:if="${#lists.isEmpty(memberships)}">등록된 회원권이 없습니다. 센터에 문의해 주세요.</p></section></main></body></html>
