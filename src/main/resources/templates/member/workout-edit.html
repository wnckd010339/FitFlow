<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>운동 기록 수정 | FitFlow</title><link rel="stylesheet" th:href="@{/css/screens/member-portal.css}"></head>
<body><header th:replace="~{member/portal-fragments :: header('workouts')}"></header><main class="portal-main"><p class="eyebrow">WORKOUT EDIT</p><h1>운동 기록 수정</h1><section class="portal-card"><form th:action="@{/member/workouts/{sessionId}(sessionId=${sessionId})}" th:object="${workoutRecordForm}" method="post" class="record-form"><input type="hidden" th:field="*{routineId}"><label>운동 종목<input th:field="*{exerciseName}"></label><small class="field-error" th:errors="*{exerciseName}"></small><label>세트 수<input th:field="*{sets}" type="number" min="1" max="20"></label><label>중량(kg)<input th:field="*{weight}" type="number" min="0" step="0.5"></label><label>횟수<input th:field="*{reps}" type="number" min="0"></label><label>운동 시간(분)<input th:field="*{durationMinutes}" type="number" min="1" max="1440"></label><small class="field-error" th:errors="*{durationMinutes}"></small><label>메모<textarea th:field="*{memo}" rows="3"></textarea></label><button>수정 저장</button><a th:href="@{/member/workouts}">취소</a></form></section></main></body></html>
