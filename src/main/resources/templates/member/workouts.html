<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>운동 | FitFlow</title><link rel="stylesheet" th:href="@{/css/screens/member-portal.css}"></head>
<body><header th:replace="~{member/portal-fragments :: header('workouts')}"></header><main class="portal-main"><p class="eyebrow">WORKOUT</p><h1>운동 루틴과 기록</h1><p class="subtitle">오늘의 루틴을 확인하고 완료한 운동을 저장하세요.</p><section class="two-columns"><article class="portal-card"><h2>활성 운동 루틴</h2><div th:if="${!#lists.isEmpty(routine)}"><h3 th:text="${routine[0].title}">루틴</h3><p th:text="${routine[0].description}">설명</p><ul class="exercise-list"><li th:each="exercise : ${routine}"><strong th:text="${exercise.exerciseName}">스쿼트</strong><span th:text="|${exercise.targetSets}세트 · ${exercise.targetRepsMin ?: '-'}~${exercise.targetRepsMax ?: '-'}회|">세트</span></li></ul></div><p class="empty" th:if="${#lists.isEmpty(routine)}">현재 활성 운동 루틴이 없습니다.</p></article><article class="portal-card"><h2>운동 기록 저장</h2><form th:action="@{/member/workouts}" th:object="${workoutRecordForm}" method="post" class="record-form"><input type="hidden" th:field="*{routineId}" th:value="${#lists.isEmpty(routine) ? null : routine[0].routineId}"><label>운동 종목<input th:field="*{exerciseName}" placeholder="예: 스쿼트"></label><small class="field-error" th:errors="*{exerciseName}"></small><label>세트 수<input th:field="*{sets}" type="number" min="1" max="20"></label><small class="field-error" th:errors="*{sets}"></small><label>중량(kg)<input th:field="*{weight}" type="number" min="0" step="0.5"></label><label>횟수<input th:field="*{reps}" type="number" min="0"></label><label>운동 시간(분)<input th:field="*{durationMinutes}" type="number" min="1" max="1440"></label><small class="field-error" th:errors="*{durationMinutes}"></small><label>메모<textarea th:field="*{memo}" rows="2"></textarea></label><button>기록 저장</button></form></article></section><section class="portal-card"><h2>최근 운동 기록</h2><p class="notice" th:if="${message}" th:text="${message}"></p><table><thead><tr><th>일시</th><th>루틴</th><th>운동 종목 수</th><th>메모</th><th></th></tr></thead><tbody><tr th:each="workout : ${workouts}"><td th:text="${#temporals.format(workout.startedAt, 'yyyy.MM.dd HH:mm')}">일시</td><td th:text="${workout.routineTitle}">루틴</td><td th:text="|${workout.exerciseCount}종목|">1종목</td><td th:text="${workout.memo ?: '-'}">메모</td><td><a th:href="@{/member/workouts/{sessionId}/edit(sessionId=${workout.sessionId})}">수정</a></td></tr><tr th:if="${#lists.isEmpty(workouts)}"><td colspan="5">저장된 운동 기록이 없습니다.</td></tr></tbody></table></section></main></body></html>
