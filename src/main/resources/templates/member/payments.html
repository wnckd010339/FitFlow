<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>결제 내역 | FitFlow</title><link rel="stylesheet" th:href="@{/css/layouts/member.css}"></head>
<body><header th:replace="~{member/portal-fragments :: header('payments')}"></header><main class="portal-main"><p class="eyebrow">PAYMENTS</p><h1>결제 내역</h1><p class="subtitle">회원권과 PT 상품의 결제·환불 내역입니다.</p><section class="portal-card"><table><thead><tr><th>일시</th><th>구분</th><th>상품</th><th>결제 수단</th><th>금액</th><th>상태</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${#temporals.format(payment.occurredAt, 'yyyy.MM.dd HH:mm')}">일시</td><td th:text="${payment.transactionType == 'REFUND' ? '환불' : '결제'}">결제</td><td th:text="${payment.productName ?: '회원권'}">상품</td><td th:text="${payment.paymentMethod}">CARD</td><td th:text="|₩${#numbers.formatInteger(payment.amount, 0, 'COMMA')}|">₩0</td><td th:text="${payment.status}">COMPLETED</td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="6">결제 내역이 없습니다.</td></tr></tbody></table></section></main></body></html>
